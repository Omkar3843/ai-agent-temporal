services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
    volumes:
      - temporal_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 3s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.25.2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgres
    ports:
      - "7233:7233"
    # Healthy once the server is serving and the "default" namespace exists.
    # The server binds the container IP, not localhost.
    healthcheck:
      test: ["CMD-SHELL", "temporal operator namespace describe -n default --address $$(hostname -i):7233 > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  temporal-ui:
    image: temporalio/ui:2.31.2
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      # Host port 8080 is commonly taken; override with TEMPORAL_UI_PORT=...
      - "${TEMPORAL_UI_PORT:-8088}:8080"

  api:
    build: .
    profiles: ["app"]
    depends_on:
      - qdrant
      - temporal
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - TEMPORAL_HOST=temporal:7233
      - USE_TEMPORAL_INGESTION=true
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads

  worker:
    build: .
    profiles: ["app"]
    depends_on:
      - qdrant
      - temporal
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - TEMPORAL_HOST=temporal:7233
    command: ["python", "-m", "app.temporal.worker"]
    volumes:
      - ./uploads:/app/uploads

volumes:
  qdrant_data:
  temporal_pg: